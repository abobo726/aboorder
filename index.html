<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📦 開團訂單管理</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft JhengHei", sans-serif;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.container {
    max-width: 1800px;
    margin: auto;
    padding: 24px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
}

.title {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #777;
    margin-top: 6px;
    font-size: 14px;
}

.btn {
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
}

.btn-blue {
    background: #2563eb;
    color: white;
}

.btn-blue:hover {
    background: #1d4ed8;
}

.btn-gray {
    background: #555;
    color: white;
}

.btn-red {
    background: #dc2626;
    color: white;
}

.btn-green {
    background: #16a34a;
    color: white;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 10px;
    padding: 18px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.stat-label {
    color: #777;
    font-size: 14px;
}

.stat-number {
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

.filters {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;

    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr auto;
    gap: 10px;
}

input,
select,
textarea {
    border: 1px solid #d1d5db;
    border-radius: 7px;
    padding: 8px 10px;
    background: white;
    font-size: 14px;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #2563eb;
    outline: none;
}

.table-box {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.table-scroll {
    overflow-x: auto;
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1450px;
}

th {
    background: #f9fafb;
    font-weight: bold;
    font-size: 14px;
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
    white-space: nowrap;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    vertical-align: top;
}

tr:hover td {
    background: #fafafa;
}

.group-input {
    width: 140px;
}

.name-input {
    width: 100px;
}

.amount-input,
.topup-input {
    width: 85px;
    text-align: right;
}

.method-select {
    width: 95px;
}

.ship-input {
    width: 125px;
}

.note-input {
    width: 170px;
    min-height: 50px;
    resize: vertical;
}

.products {
    min-width: 380px;
}

.product-item {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 5px;
}

.product-check {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
}

.product-name {
    width: 200px;
}

.quantity {
    width: 55px;
}

.product-name.arrived {
    text-decoration: line-through;
    opacity: .5;
}

.delete-product {
    border: 0;
    background: none;
    color: #ef4444;
    font-size: 18px;
    padding: 0 4px;
}

.add-product {
    border: 0;
    background: none;
    color: #2563eb;
    padding: 4px 0;
    font-size: 13px;
}

.empty {
    text-align: center;
    padding: 50px;
    color: #999;
}

.bottom-buttons {
    margin-top: 18px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.file-input {
    display: none;
}

@media (max-width: 800px) {

    .container {
        padding: 12px;
    }

    .header {
        flex-direction: column;
        align-items: stretch;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- 標題 -->
    <div class="header">

        <div>
            <h1 class="title">📦 開團訂單管理</h1>

            <div class="subtitle">
                一人一列・多商品・各商品獨立到貨
            </div>
        </div>

        <button id="addOrderBtn"
                type="button"
                class="btn btn-blue">
            ＋ 新增訂單
        </button>

    </div>


    <!-- 統計 -->
    <div class="stats">

        <div class="stat">
            <div class="stat-label">📦 訂單數</div>
            <div id="totalOrders" class="stat-number">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">💰 總金額</div>
            <div id="totalAmount" class="stat-number">$0</div>
        </div>

        <div class="stat">
            <div class="stat-label">💵 未收款</div>
            <div id="unpaidAmount" class="stat-number">$0</div>
        </div>

        <div class="stat">
            <div class="stat-label">🧾 二補</div>
            <div id="topupAmount" class="stat-number">$0</div>
        </div>

    </div>


    <!-- 篩選 -->
    <div class="filters">

        <input
            id="searchInput"
            type="text"
            placeholder="🔍 搜尋姓名、商品、備註、單號"
        >

        <select id="groupFilter">
            <option value="">📦 全部開團</option>
        </select>

        <select id="paymentFilter">

            <option value="">
                💰 全部收款
            </option>

            <option value="paid">
                ☑️ 已收款
            </option>

            <option value="unpaid">
                ⬜ 未收款
            </option>

        </select>

        <select id="arrivalFilter">

            <option value="">
                📬 全部到貨
            </option>

            <option value="arrived">
                ☑️ 全部到貨
            </option>

            <option value="notArrived">
                ⬜ 尚未全部到貨
            </option>

        </select>

        <button
            id="clearFilterBtn"
            type="button"
            class="btn">
            清除篩選
        </button>

    </div>


    <!-- 表格 -->
    <div class="table-box">

        <div class="table-scroll">

            <table>

                <thead>

                    <tr>

                        <th style="width:60px;text-align:center;">
                            操作
                        </th>

                        <th>
                            開團名稱
                        </th>

                        <th>
                            買家姓名
                        </th>

                        <th>
                            商品明細<br>
                            <small style="font-weight:normal;color:#888;">
                                已到貨可個別勾選
                            </small>
                        </th>

                        <th>
                            總金額
                        </th>

                        <th>
                            付款狀態
                        </th>

                        <th>
                            二補金額
                        </th>

                        <th>
                            物流方式
                        </th>

                        <th>
                            寄件單號
                        </th>

                        <th>
                            備註說明
                        </th>

                    </tr>

                </thead>

                <tbody id="orderTableBody"></tbody>

            </table>

        </div>

    </div>


    <!-- 底部按鈕 -->
    <div class="bottom-buttons">

        <button
            id="exportCsvBtn"
            type="button"
            class="btn btn-gray">
            📥 匯出資料備份
        </button>

        <button
            id="importCsvBtn"
            type="button"
            class="btn btn-gray">
            📤 匯入資料復原
        </button>

        <input
            id="importFile"
            class="file-input"
            type="file"
            accept=".json"
        >

        <button
            id="resetAllBtn"
            type="button"
            class="btn btn-red"
            style="margin-left:auto;">
            ⚠️ 清空所有資料
        </button>

    </div>

</div>


<script>

/* =========================================================
   資料設定
========================================================= */

const STORAGE_KEY = "G_DATA_V7";


/* 建立新的商品 */
function createProduct() {

    return {
        name: "",
        quantity: 1,
        isArrived: false
    };

}


/* 建立新的訂單 */
function createOrder() {

    return {
        id: "o_" + Date.now() + "_" + Math.random().toString(36).substring(2, 8),

        groupName: "",

        buyerName: "",

        products: [
            createProduct()
        ],

        amount: 0,

        isPaid: false,

        topup: 0,

        shipMethod: "7-11",

        shipCode: "",

        note: ""
    };

}


/* =========================================================
   讀取資料
========================================================= */

let orderList = [];


try {

    const localData =
        localStorage.getItem(STORAGE_KEY);

    if (localData) {

        const parsed =
            JSON.parse(localData);

        if (Array.isArray(parsed)) {

            orderList = parsed;

        }

    }

} catch (error) {

    console.error(
        "讀取資料失敗：",
        error
    );

}


/* 如果完全沒有資料，就建立一筆空白訂單 */
if (orderList.length === 0) {

    orderList.push(createOrder());

}


/* =========================================================
   DOM
========================================================= */

const dom = {

    body:
        document.getElementById(
            "orderTableBody"
        ),

    search:
        document.getElementById(
            "searchInput"
        ),

    group:
        document.getElementById(
            "groupFilter"
        ),

    payment:
        document.getElementById(
            "paymentFilter"
        ),

    arrival:
        document.getElementById(
            "arrivalFilter"
        )

};


/* =========================================================
   儲存
========================================================= */

function saveData() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(orderList)
        );

    } catch (error) {

        console.error(
            "儲存資料失敗：",
            error
        );

    }

    updateStats();

    updateGroupFilter();

}


/* =========================================================
   統計
========================================================= */

function updateStats() {

    let totalOrders =
        orderList.length;

    let totalAmount = 0;

    let unpaidAmount = 0;

    let topupAmount = 0;


    orderList.forEach(order => {

        const amount =
            Number(order.amount) || 0;

        const topup =
            Number(order.topup) || 0;


        totalAmount += amount;

        topupAmount += topup;


        if (!order.isPaid) {

            unpaidAmount += amount;

        }

    });


    document.getElementById(
        "totalOrders"
    ).innerText =
        totalOrders;


    document.getElementById(
        "totalAmount"
    ).innerText =
        "$" +
        totalAmount.toLocaleString();


    document.getElementById(
        "unpaidAmount"
    ).innerText =
        "$" +
        unpaidAmount.toLocaleString();


    document.getElementById(
        "topupAmount"
    ).innerText =
        "$" +
        topupAmount.toLocaleString();

}


/* =========================================================
   開團篩選
========================================================= */

function updateGroupFilter() {

    const current =
        dom.group.value;


    const groups =
        new Set();


    orderList.forEach(order => {

        const group =
            String(
                order.groupName || ""
            ).trim();


        if (group) {

            groups.add(group);

        }

    });


    dom.group.innerHTML =
        '<option value="">📦 全部開團</option>';


    Array.from(groups)
        .sort((a, b) =>
            a.localeCompare(
                b,
                "zh-Hant"
            )
        )
        .forEach(group => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                group;

            option.innerText =
                group;


            if (group === current) {

                option.selected =
                    true;

            }


            dom.group.appendChild(
                option
            );

        });

}


/* =========================================================
   HTML 安全處理
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   重新整理表格
========================================================= */

function renderTable() {

    dom.body.innerHTML = "";


    const keyword =
        dom.search.value
            .toLowerCase()
            .trim();


    const group =
        dom.group.value;


    const payment =
        dom.payment.value;


    const arrival =
        dom.arrival.value;


    const filtered =
        orderList.filter(order => {


            /* 搜尋 */

            const searchableText = [

                order.buyerName,

                order.groupName,

                order.note,

                order.shipCode,

                ...(order.products || [])
                    .map(product =>
                        product.name
                    )

            ]
            .join(" ")
            .toLowerCase();


            const matchKeyword =
                !keyword ||
                searchableText.includes(
                    keyword
                );


            /* 開團 */

            const matchGroup =
                !group ||
                order.groupName === group;


            /* 付款 */

            let matchPayment = true;


            if (payment === "paid") {

                matchPayment =
                    order.isPaid === true;

            }


            if (payment === "unpaid") {

                matchPayment =
                    order.isPaid !== true;

            }


            /* 到貨 */

            const products =
                order.products || [];


            const allArrived =
                products.length > 0 &&
                products.every(
                    product =>
                        product.isArrived === true
                );


            let matchArrival = true;


            if (arrival === "arrived") {

                matchArrival =
                    allArrived;

            }


            if (arrival === "notArrived") {

                matchArrival =
                    !allArrived;

            }


            return (

                matchKeyword &&
                matchGroup &&
                matchPayment &&
                matchArrival

            );

        });


    if (filtered.length === 0) {

        dom.body.innerHTML = `

            <tr>

                <td
                    colspan="10"
                    class="empty">

                    📭 目前沒有符合條件的訂單資料。

                </td>

            </tr>

        `;

        return;

    }


    filtered.forEach(order => {

        const tr =
            document.createElement("tr");


        /* =================================================
           商品欄
        ================================================= */

        let productHTML =
            `<div class="products">`;


        const products =
            order.products || [];


        products.forEach(
            (product, index) => {


                productHTML += `

                    <div class="product-item">

                        <input
                            type="checkbox"
                            class="product-check"
                            ${
                                product.isArrived
                                    ? "checked"
                                    : ""
                            }
                            onchange="
                                toggleProductArrived(
                                    '${order.id}',
                                    ${index}
                                )
                            "
                        >

                        <input
                            type="text"
                            class="product-name ${
                                product.isArrived
                                    ? "arrived"
                                    : ""
                            }"
                            value="${escapeHTML(
                                product.name
                            )}"
                            placeholder="商品名稱"
                            onchange="
                                updateProduct(
                                    '${order.id}',
                                    ${index},
                                    'name',
                                    this.value
                                )
                            "
                        >

                        <input
                            type="number"
                            class="quantity"
                            value="${
                                Number(
                                    product.quantity
                                ) || 1
                            }"
                            min="1"
                            onchange="
                                updateProduct(
                                    '${order.id}',
                                    ${index},
                                    'quantity',
                                    this.value
                                )
                            "
                        >

                        <button
                            type="button"
                            class="delete-product"
                            title="刪除此商品"
                            onclick="
                                removeProduct(
                                    '${order.id}',
                                    ${index}
                                )
                            "
                        >
                            ×
                        </button>

                    </div>

                `;

            }
        );


        productHTML += `

            <button
                type="button"
                class="add-product"
                onclick="
                    addProduct(
                        '${order.id}'
                    )
                "
            >
                ＋ 新增品項
            </button>

        </div>`;


        /* =================================================
           整列
        ================================================= */

        tr.innerHTML = `

            <!-- 操作 -->

            <td style="text-align:center;">

                <button
                    type="button"
                    class="btn btn-red"
                    style="
                        padding:4px 8px;
                        font-size:12px;
                    "
                    onclick="
                        deleteOrder(
                            '${order.id}'
                        )
                    "
                >
                    刪除
                </button>

            </td>


            <!-- 開團 -->

            <td>

                <input
                    type="text"
                    class="group-input"
                    value="${escapeHTML(
                        order.groupName
                    )}"
                    placeholder="開團名稱"
                    onchange="
                        updateField(
                            '${order.id}',
                            'groupName',
                            this.value
                        )
                    "
                >

            </td>


            <!-- 姓名 -->

            <td>

                <input
                    type="text"
                    class="name-input"
                    value="${escapeHTML(
                        order.buyerName
                    )}"
                    placeholder="姓名"
                    onchange="
                        updateField(
                            '${order.id}',
                            'buyerName',
                            this.value
                        )
                    "
                >

            </td>


            <!-- 商品 -->

            <td>
                ${productHTML}
            </td>


            <!-- 金額 -->

            <td>

                <input
                    type="number"
                    class="amount-input"
                    value="${
                        Number(
                            order.amount
                        ) || 0
                    }"
                    min="0"
                    onchange="
                        updateField(
                            '${order.id}',
                            'amount',
                            this.value
                        )
                    "
                >

            </td>


            <!-- 付款 -->

            <td>

                <select
                    class="method-select"
                    onchange="
                        updateField(
                            '${order.id}',
                            'isPaid',
                            this.value === 'true'
                        )
                    "
                >

                    <option
                        value="false"
                        ${
                            !order.isPaid
                                ? "selected"
                                : ""
                        }
                    >
                        ⬜ 未收款
                    </option>

                    <option
                        value="true"
                        ${
                            order.isPaid
                                ? "selected"
                                : ""
                        }
                    >
                        ☑️ 已收款
                    </option>

                </select>

            </td>


            <!-- 二補 -->

            <td>

                <input
                    type="number"
                    class="topup-input"
                    value="${
                        Number(
                            order.topup
                        ) || 0
                    }"
                    min="0"
                    onchange="
                        updateField(
                            '${order.id}',
                            'topup',
                            this.value
                        )
                    "
                >

            </td>


            <!-- 物流 -->

            <td>

                <select
                    class="method-select"
                    onchange="
                        updateField(
                            '${order.id}',
                            'shipMethod',
                            this.value
                        )
                    "
                >

                    <option
                        value="7-11"
                        ${
                            order.shipMethod === "7-11"
                                ? "selected"
                                : ""
                        }
                    >
                        7-11
                    </option>

                    <option
                        value="全家"
                        ${
                            order.shipMethod === "全家"
                                ? "selected"
                                : ""
                        }
                    >
                        全家
                    </option>

                    <option
                        value="萊爾富"
                        ${
                            order.shipMethod === "萊爾富"
                                ? "selected"
                                : ""
                        }
                    >
                        萊爾富
                    </option>

                    <option
                        value="OK"
                        ${
                            order.shipMethod === "OK"
                                ? "selected"
                                : ""
                        }
                    >
                        OK
                    </option>

                    <option
                        value="郵寄"
                        ${
                            order.shipMethod === "郵寄"
                                ? "selected"
                                : ""
                        }
                    >
                        郵寄
                    </option>

                    <option
                        value="面交"
                        ${
                            order.shipMethod === "面交"
                                ? "selected"
                                : ""
                        }
                    >
                        面交
                    </option>

                </select>

            </td>


            <!-- 單號 -->

            <td>

                <input
                    type="text"
                    class="ship-input"
                    value="${escapeHTML(
                        order.shipCode
                    )}"
                    placeholder="寄件單號"
                    onchange="
                        updateField(
                            '${order.id}',
                            'shipCode',
                            this.value
                        )
                    "
                >

            </td>


            <!-- 備註 -->

            <td>

                <textarea
                    class="note-input"
                    placeholder="備註"
                    onchange="
                        updateField(
                            '${order.id}',
                            'note',
                            this.value
                        )
                    "
                >${escapeHTML(
                    order.note
                )}</textarea>

            </td>

        `;


        dom.body.appendChild(tr);

    });

}


/* =========================================================
   更新一般欄位
========================================================= */

function updateField(
    id,
    field,
    value
) {

    const order =
        orderList.find(
            item => item.id === id
        );


    if (!order) return;


    if (
        field === "amount" ||
        field === "topup"
    ) {

        order[field] =
            Number(value) || 0;

    } else {

        order[field] =
            value;

    }


    saveData();

    renderTable();

}


/* =========================================================
   新增訂單
========================================================= */

function addOrder() {

    const newOrder =
        createOrder();


    orderList.push(
        newOrder
    );


    saveData();

    renderTable();


    /* 自動捲到最下面 */

    setTimeout(() => {

        window.scrollTo({

            top:
                document.body.scrollHeight,

            behavior:
                "smooth"

        });

    }, 50);

}


/* =========================================================
   刪除訂單
========================================================= */

function deleteOrder(id) {

    const order =
        orderList.find(
            item => item.id === id
        );


    if (!order) return;


    const buyer =
        order.buyerName
            ? `「${order.buyerName}」`
            : "這筆訂單";


    if (
        !confirm(
            `確定要刪除 ${buyer} 嗎？\n\n刪除後無法從此頁面復原。`
        )
    ) {

        return;

    }


    orderList =
        orderList.filter(
            item => item.id !== id
        );


    saveData();

    renderTable();

}


/* =========================================================
   新增商品
========================================================= */

function addProduct(orderId) {

    const order =
        orderList.find(
            item => item.id === orderId
        );


    if (!order) return;


    if (!Array.isArray(order.products)) {

        order.products = [];

    }


    order.products.push(
        createProduct()
    );


    saveData();

    renderTable();

}


/* =========================================================
   更新商品
========================================================= */

function updateProduct(
    orderId,
    index,
    field,
    value
) {

    const order =
        orderList.find(
            item => item.id === orderId
        );


    if (!order) return;


    if (!order.products[index]) {

        return;

    }


    if (field === "quantity") {

        order.products[index][field] =
            Math.max(
                1,
                Number(value) || 1
            );

    } else {

        order.products[index][field] =
            value;

    }


    saveData();

    renderTable();

}


/* =========================================================
   到貨勾選
========================================================= */

function toggleProductArrived(
    orderId,
    index
) {

    const order =
        orderList.find(
            item => item.id === orderId
        );


    if (!order) return;


    if (!order.products[index]) {

        return;

    }


    order.products[index].isArrived =
        !order.products[index].isArrived;


    saveData();

    renderTable();

}


/* =========================================================
   刪除商品
========================================================= */

function removeProduct(
    orderId,
    index
) {

    const order =
        orderList.find(
            item => item.id === orderId
        );


    if (!order) return;


    if (
        order.products.length <= 1
    ) {

        alert(
            "至少要保留一個商品品項。"
        );

        return;

    }


    order.products.splice(
        index,
        1
    );


    saveData();

    renderTable();

}


/* =========================================================
   清除篩選
========================================================= */

function clearFilters() {

    dom.search.value = "";

    dom.group.value = "";

    dom.payment.value = "";

    dom.arrival.value = "";


    renderTable();

}


/* =========================================================
   匯出 JSON 備份
========================================================= */

function exportData() {

    try {

        const data =
            JSON.stringify(
                orderList,
                null,
                2
            );


        const blob =
            new Blob(
                [data],
                {
                    type:
                        "application/json;charset=utf-8"
                }
            );


        const url =
            URL.createObjectURL(
                blob
            );


        const a =
            document.createElement(
                "a"
            );


        const now =
            new Date();


        const date =
            now.getFullYear() +
            "-" +
            String(
                now.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                now.getDate()
            ).padStart(2, "0");


        a.href = url;

        a.download =
            `開團訂單備份_${date}.json`;


        document.body.appendChild(a);

        a.click();

        a.remove();


        URL.revokeObjectURL(
            url
        );


    } catch (error) {

        alert(
            "匯出失敗，請稍後再試。"
        );

        console.error(error);

    }

}


/* =========================================================
   匯入 JSON
========================================================= */

function importData(file) {

    if (!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            try {

                const imported =
                    JSON.parse(
                        event.target.result
                    );


                if (
                    !Array.isArray(
                        imported
                    )
                ) {

                    throw new Error(
                        "格式錯誤"
                    );

                }


                if (
                    !confirm(
                        `確定要匯入這份資料嗎？\n\n目前資料會被匯入內容取代。`
                    )
                ) {

                    return;

                }


                orderList =
                    imported;


                /* 補齊舊資料可能缺少的欄位 */

                orderList.forEach(
                    order => {

                        if (
                            !order.id
                        ) {

                            order.id =
                                "o_" +
                                Date.now() +
                                "_" +
                                Math.random()
                                    .toString(36)
                                    .substring(
                                        2,
                                        8
                                    );

                        }


                        if (
                            !Array.isArray(
                                order.products
                            )
                        ) {

                            order.products =
                                [
                                    createProduct()
                                ];

                        }


                        if (
                            order.amount ===
                            undefined
                        ) {

                            order.amount = 0;

                        }


                        if (
                            order.topup ===
                            undefined
                        ) {

                            order.topup = 0;

                        }


                        if (
                            order.isPaid ===
                            undefined
                        ) {

                            order.isPaid =
                                false;

                        }


                        if (
                            !order.shipMethod
                        ) {

                            order.shipMethod =
                                "7-11";

                        }


                        order.products.forEach(
                            product => {

                                if (
                                    product.quantity ===
                                    undefined
                                ) {

                                    product.quantity =
                                        1;

                                }


                                if (
                                    product.isArrived ===
                                    undefined
                                ) {

                                    product.isArrived =
                                        false;

                                }

                            }
                        );

                    }
                );


                saveData();

                renderTable();


                alert(
                    "✅ 資料匯入成功！"
                );


            } catch (error) {

                alert(
                    "❌ 匯入失敗！\n\n請確認選擇的是本系統匯出的 JSON 備份檔。"
                );


                console.error(
                    error
                );

            }

        };


    reader.readAsText(
        file,
        "UTF-8"
    );

}


/* =========================================================
   清空所有資料
========================================================= */

function resetAll() {

    if (
        !confirm(
            "⚠️ 確定要清空所有訂單資料嗎？\n\n這個動作無法復原！"
        )
    ) {

        return;

    }


    if (
        !confirm(
            "再確認一次：真的要全部刪除嗎？"
        )
    ) {

        return;

    }


    orderList = [];


    localStorage.removeItem(
        STORAGE_KEY
    );


    orderList.push(
        createOrder()
    );


    saveData();

    renderTable();

}


/* =========================================================
   事件監聽
========================================================= */


/* 新增訂單 */

document
    .getElementById(
        "addOrderBtn"
    )
    .addEventListener(
        "click",
        addOrder
    );


/* 搜尋 */

dom.search.addEventListener(
    "input",
    renderTable
);


/* 開團 */

dom.group.addEventListener(
    "change",
    renderTable
);


/* 付款 */

dom.payment.addEventListener(
    "change",
    renderTable
);


/* 到貨 */

dom.arrival.addEventListener(
    "change",
    renderTable
);


/* 清除篩選 */

document
    .getElementById(
        "clearFilterBtn"
    )
    .addEventListener(
        "click",
        clearFilters
);


/* 匯出 */

document
    .getElementById(
        "exportCsvBtn"
    )
    .addEventListener(
        "click",
        exportData
);


/* 匯入按鈕 */

document
    .getElementById(
        "importCsvBtn"
    )
    .addEventListener(
        "click",
        function() {

            document
                .getElementById(
                    "importFile"
                )
                .click();

        }
    );


/* 選擇檔案後匯入 */

document
    .getElementById(
        "importFile"
    )
    .addEventListener(
        "change",
        function() {

            const file =
                this.files[0];


            if (file) {

                importData(
                    file
                );

            }


            this.value = "";

        }
    );


/* 清空 */

document
    .getElementById(
        "resetAllBtn"
    )
    .addEventListener(
        "click",
        resetAll
    );


/* =========================================================
   第一次載入
========================================================= */

updateStats();

updateGroupFilter();

renderTable();

</script>
